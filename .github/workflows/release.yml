name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            gnu: x86_64-linux-gnu
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            gnu: aarch64-linux-gnu
    # GitHub-hosted only; see ci.yml.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            musl-tools linux-libc-dev protobuf-compiler pkg-config file
          # libusb's Linux backend includes kernel UAPI headers, which
          # Ubuntu's musl-gcc does not see; expose them to it.
          sudo ln -sfn /usr/include/linux /usr/include/${{ matrix.arch }}-linux-musl/linux
          sudo ln -sfn /usr/include/asm-generic /usr/include/${{ matrix.arch }}-linux-musl/asm-generic
          sudo ln -sfn /usr/include/${{ matrix.gnu }}/asm /usr/include/${{ matrix.arch }}-linux-musl/asm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build a static binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p tryx --features static --target ${{ matrix.target }}

      - name: Generate the man page and completions
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/tryx
          file "$bin"
          "$bin" --version
          mkdir -p target/packaging
          "$bin" manpage > target/packaging/tryx.1
          "$bin" completions bash > target/packaging/tryx.bash
          "$bin" completions zsh > target/packaging/_tryx
          "$bin" completions fish > target/packaging/tryx.fish

      - name: Package the tarball
        id: tarball
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tryx") | .version')
          name="tryx-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name/udev" "dist/$name/completions"
          cp target/${{ matrix.target }}/release/tryx "dist/$name/"
          cp packaging/udev/*.rules "dist/$name/udev/"
          cp target/packaging/tryx.1 "dist/$name/"
          cp target/packaging/tryx.bash target/packaging/_tryx target/packaging/tryx.fish "dist/$name/completions/"
          cp README.md LICENSE THIRD_PARTY.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the .deb
        run: |
          set -euo pipefail
          cargo install cargo-deb --locked
          cargo deb -p tryx --no-build --no-strip --target ${{ matrix.target }}
          deb=$(ls target/${{ matrix.target }}/debian/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          cp "$deb" dist/
          (cd dist && sha256sum ./*.deb > "$(basename "$deb").sha256")

      - name: Smoke-test the packaged binary
        run: |
          set -euo pipefail
          name="tryx-${{ steps.tarball.outputs.version }}-${{ matrix.target }}"
          "dist/$name/tryx" doctor || test $? -eq 4
          "dist/$name/tryx" devices --json
          "dist/$name/tryx" media check --target kanali-turris README.md || test $? -eq 5

      - uses: actions/upload-artifact@v4
        with:
          name: tryx-linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tryx-linux-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.deb dist/*.sha256 --title "$GITHUB_REF_NAME" --generate-notes
