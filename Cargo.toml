[workspace]
resolver = "3"
members = ["crates/tryxctl", "crates/tryx-device", "crates/tryx-kanali", "crates/tryx-legacy", "crates/tryx-media", "crates/tryx-monitor", "crates/tryx-proto", "crates/tryx-testkit"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nicklambourne/tryxctl"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
owo-colors = { version = "4", features = ["supports-colors"] }
predicates = "3"
proptest = "1"
prost = "0.14"
prost-build = "0.14"
rusb = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
which = "7"
