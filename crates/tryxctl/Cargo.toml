[package]
name = "tryxctl"
description = "Command-line controller for TRYX cooler displays"
authors = ["Nicholas Lambourne <dev@ndl.au>"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
clap_mangen = "0.2"
crossterm = "0.28"
ratatui = "0.29"
owo-colors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
libc = "0.2"
tryx-device = { path = "../tryx-device" }
tryx-kanali = { path = "../tryx-kanali" }
tryx-legacy = { path = "../tryx-legacy" }
tryx-media = { path = "../tryx-media" }
tryx-monitor = { path = "../tryx-monitor" }
viuer = { version = "0.9", features = ["print-file"] }
which = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30", features = ["user"] }

[dev-dependencies]
assert_cmd = { workspace = true }
which = { workspace = true }

[features]
static = ["tryx-device/static"]

# `cargo deb` packaging. The release workflow generates the man page and
# completions into target/packaging before running it.
[package.metadata.deb]
section = "utils"
priority = "optional"
depends = "$auto"
recommends = "ffmpeg, adb"
extended-description = """Controls TRYX Panorama cooler displays from the terminal: upload images and
videos with validation and conversion, manage the files on the display, set
brightness, and show live CPU, GPU, and memory readings in the overlay."""
# Paths are relative to this manifest, except target/release/, which
# cargo-deb maps to the build target directory.
maintainer-scripts = "../../packaging/deb"
assets = [
    ["target/release/tryxctl", "usr/bin/", "755"],
    ["../../packaging/udev/70-tryx-access.rules", "lib/udev/rules.d/", "644"],
    ["../../packaging/udev/71-tryx-legacy.rules", "lib/udev/rules.d/", "644"],
    ["../../packaging/udev/99-tryx-printer.rules", "lib/udev/rules.d/", "644"],
    ["../../target/packaging/tryxctl.1", "usr/share/man/man1/", "644"],
    ["../../target/packaging/tryxctl.bash", "usr/share/bash-completion/completions/tryxctl", "644"],
    ["../../target/packaging/_tryxctl", "usr/share/zsh/vendor-completions/", "644"],
    ["../../target/packaging/tryxctl.fish", "usr/share/fish/vendor_completions.d/", "644"],
    ["../../README.md", "usr/share/doc/tryxctl/", "644"],
    ["../../THIRD_PARTY.md", "usr/share/doc/tryxctl/", "644"],
]
