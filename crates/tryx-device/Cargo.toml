[package]
name = "tryx-device"
description = "Discovery and product profiles for TRYX cooler displays"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rusb = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["fs", "user"] }

[features]
# Build libusb from source and link it statically, for musl releases.
static = ["rusb/vendored"]
