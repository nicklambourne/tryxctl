[package]
name = "tryx"
description = "Command-line controller for TRYX cooler displays"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
crossterm = "0.28"
ratatui = "0.29"
owo-colors = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tryx-device = { path = "../tryx-device" }
tryx-legacy = { path = "../tryx-legacy" }
tryx-media = { path = "../tryx-media" }
tryx-monitor = { path = "../tryx-monitor" }
viuer = { version = "0.9", features = ["print-file"] }
which = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30", features = ["user"] }

[dev-dependencies]
assert_cmd = { workspace = true }
which = { workspace = true }
